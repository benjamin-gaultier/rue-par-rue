[project]
name = "rpr"
version = "0.1.0"
description = "Rue par Rue data pipeline: harvest and normalise historical Paris sources"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
geo = ["pyshp>=2.3", "pyproj>=3.6", "shapely>=2.0"]
vision = ["opencv-python-headless>=4.9", "numpy>=1.26", "pillow>=10"]
depth = ["onnxruntime>=1.18", "numpy>=1.26", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rpr*"]
