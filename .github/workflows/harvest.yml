# Runs a pipeline source on GitHub's runners and commits the result to the
# branch it was started from. Some portals (Opendatasoft: the Albert-Kahn
# data) refuse connections from certain cloud sandboxes, so harvesting here
# is the reliable path.
name: Harvest

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source to harvest
        type: choice
        options: [kahn, parismusees, verniquet, vasserot]
        default: kahn
      inspect:
        description: Only print the source's live fields (no commit)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: harvest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    env:
      SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e pipeline

      - name: Inspect fields
        if: ${{ inputs.inspect }}
        env:
          PARISMUSEES_TOKEN: ${{ secrets.PARISMUSEES_TOKEN }}
        run: python -m rpr "$SOURCE" --inspect

      - name: Harvest
        if: ${{ !inputs.inspect }}
        env:
          PARISMUSEES_TOKEN: ${{ secrets.PARISMUSEES_TOKEN }}
        run: python -m rpr "$SOURCE"

      - name: Commit data
        if: ${{ !inputs.inspect }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: harvest $SOURCE"
          git push
